version: 2
updates:
  # Backend Node.js
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  # Flutter / Dart
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      flutter-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions (giữ SHA-pin luôn mới nhất)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
