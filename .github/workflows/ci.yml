name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hủy các lần chạy cũ của cùng nhánh/PR khi có push mới (tiết kiệm runner).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Quyền tối thiểu theo mặc định (nguyên tắc least-privilege).
permissions:
  contents: read

jobs:
  # Phát hiện phạm vi thay đổi để chỉ chạy job liên quan (monorepo).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
              - '.github/workflows/ci.yml'
              - 'Makefile'
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - '.github/workflows/ci.yml'
              - 'Makefile'

  backend:
    name: Backend (lint + format + test + coverage)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vimart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vimart_test
      JWT_SECRET: test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install deps
        run: cd server && npm ci
      - name: Lint + format
        run: make be-lint be-format-check
      - name: Test + coverage
        run: make be-coverage
      - name: Coverage summary
        if: always()
        run: |
          f=server/coverage/lcov.info
          if [ -f "$f" ]; then
            found=$(grep -c '^DA:' "$f" || echo 0)
            hit=$(grep '^DA:' "$f" | awk -F, '$2>0' | wc -l | tr -d ' ')
            pct=$(awk "BEGIN { if ($found>0) printf \"%.1f\", ($hit/$found)*100; else print \"0\" }")
            echo "### Backend coverage: ${pct}% (${hit}/${found} lines)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: server/coverage
          retention-days: 7
          if-no-files-found: ignore

  flutter:
    name: Flutter (analyze + test + coverage)
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true
      - name: Install deps
        run: flutter pub get
      - name: Analyze + format(test) + test + coverage
        run: make app-analyze app-format-check app-coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            found=$(grep -c '^DA:' coverage/lcov.info || echo 0)
            hit=$(grep '^DA:' coverage/lcov.info | awk -F, '$2>0' | wc -l | tr -d ' ')
            pct=$(awk "BEGIN { if ($found>0) printf \"%.1f\", ($hit/$found)*100; else print \"0\" }")
            echo "### Flutter coverage: ${pct}% (${hit}/${found} lines)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  # Cổng tổng hợp: 1 status check duy nhất, xanh nếu không job nào FAIL
  # (job bị bỏ qua do path-filter không tính là fail).
  ci-ok:
    name: CI passed
    needs: [backend, flutter]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify no job failed
        run: |
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.flutter.result }}" = "failure" ]; then
            echo "A required job failed."; exit 1;
          fi
          echo "All required jobs passed or were skipped."
