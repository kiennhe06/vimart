name: 🐛 Báo lỗi
description: Báo một lỗi trong ViMart
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Mô tả lỗi
      description: Chuyện gì xảy ra? Bạn mong đợi điều gì?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. Mở màn ...
        2. Bấm ...
        3. Thấy lỗi ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Khu vực
      options:
        - App Flutter
        - Backend / API
        - Web admin
        - Khác
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Môi trường
      placeholder: 'vd: iPhone 16 simulator, Flutter 3.44.3, Node 22'
  - type: textarea
    id: extra
    attributes:
      label: Ảnh chụp / log (nếu có)
