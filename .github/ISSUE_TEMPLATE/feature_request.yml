name: ✨ Đề xuất tính năng
description: Gợi ý một tính năng hoặc cải tiến cho ViMart
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề / nhu cầu
      description: Bạn muốn giải quyết điều gì?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Giải pháp mong muốn
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Phương án khác đã cân nhắc
